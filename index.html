        // demo-problems.js 로드 확인 - 중복 로드 방지
        let demoProblemsLoaded = false;
        let demoProblemsLoadAttempted = false;
        
        function checkDemoProblems() {
            console.log('Checking DEMO_PROBLEMS...');
            if (!window.DEMO_PROBLEMS) {
                console.error('DEMO_PROBLEMS is undefined');
                return false;
            }
            if (!Array.isArray(window.DEMO_PROBLEMS)) {
                console.error('DEMO_PROBLEMS is not an array:', typeof window.DEMO_PROBLEMS);
                return false;
            }
            console.log('✓ DEMO_PROBLEMS loaded:', window.DEMO_PROBLEMS.length, 'problems');
            if (window.DEMO_PROBLEMS.length > 0) {
                console.log('First problem sample:', {
                    id: window.DEMO_PROBLEMS[0].id,
                    type: window.DEMO_PROBLEMS[0].type,
                    difficulty: window.DEMO_PROBLEMS[0].difficulty
                });
            }
            demoProblemsLoaded = true;
            return true;
        }
        
        // 페이지 로드 후 동적 로드 확인
        window.addEventListener('load', function() {
            setTimeout(() => {
                if (!demoProblemsLoaded && (!window.DEMO_PROBLEMS || window.DEMO_PROBLEMS.length === 0)) {
                    if (!demoProblemsLoadAttempted) {
                        console.warn('DEMO_PROBLEMS not loaded, trying alternative path...');
                        demoProblemsLoadAttempted = true;
                        const script = document.createElement('script');
                        script.src = './data/demo-problems.js';
                        script.onerror = () => console.error('Failed to load demo-problems.js');
                        script.onload = () => {
                            setTimeout(checkDemoProblems, 500);
                        };
                        document.head.appendChild(script);
                    }
                } else {
                    checkDemoProblems();
                }
            }, 500);
        });
    </script>

            { question: "분산 데이터베이스에서 데이터 무결성을 보장하는 방법은?", type: "multiple_choice", difficulty: "hard", options: ["2단계 커밋(2PC)", "샤딩", "복제", "캐싱"], correct: 0, solution: "2단계 커밋(2-Phase Commit)은 분산 환경에서 트랜잭션의 원자성과 일관성을 보장합니다.", hints: ["분산 환경에서의 동기화", "커밋 프로토콜"], concepts: ["분산 DB", "2PC", "일관성"], solutionSteps: ["분산 환경의 문제", "2PC의 단계", "데이터 무결성 보장"] }
        ];        // 앱 초기화
        window.addEventListener('load', () => {
            checkReviewMode();
        });

        /**
         * 복습 모드 확인
         */
        async function checkReviewMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const reviewParam = urlParams.get('review');
            
            if (reviewParam) {
                reviewMode = true;
                reviewWrongAnswerId = reviewParam;
                
                // 복습할 오답 데이터 로드
                const wrongAnswer = await WrongAnswerDB.getWrongAnswerByQuestionId(reviewParam);
                if (wrongAnswer) {
                    // 복습용 문제로 설정
                    quizData = [{
                        id: wrongAnswer.questionId,
                        question: wrongAnswer.question,
                        options: [wrongAnswer.correctAnswer], // 정답만 제시 (다시 풀기용)
                        answer: wrongAnswer.correctAnswer,
                        explanation: wrongAnswer.explanation,
                        solution: wrongAnswer.explanation,
                        concepts: wrongAnswer.concepts,
                        difficulty: wrongAnswer.difficulty,
                        type: wrongAnswer.questionType
                    }];
                    
                    document.getElementById('setupSection').classList.add('hidden');
                    document.getElementById('quizSection').classList.remove('hidden');
                    displayProblem();
                } else {
                    reviewMode = false;
                }
            }
        }        // GitHub Pages 배포용: 항상 데모 모드 사용
        function initializeDemo() {
            console.log('데모 모드 초기화 완료');
        }

        async function startQuiz() {
            const difficulties = Array.from(document.querySelectorAll('input[name="difficulty"]:checked')).map(cb => cb.value);
            const types = Array.from(document.querySelectorAll('input[name="type"]:checked')).map(cb => cb.value);
            const count = parseInt(document.getElementById('questionCount').value);

            if (difficulties.length === 0 || types.length === 0) { alert('난이도와 유형을 선택하세요!'); return; }

            console.log('데모 문제 생성 시작:', { difficulties, types, count });
            generateProblemsWithDemo(difficulties, types, count);
        }

        function generateProblemsWithDemo(difficulties, types, count) {
            console.log('데모 문제 생성 시작:', { difficulties, types, count });
            console.log('DEMO_PROBLEMS 확인:', {
                exists: !!window.DEMO_PROBLEMS,
                isArray: Array.isArray(window.DEMO_PROBLEMS),
                length: window.DEMO_PROBLEMS ? window.DEMO_PROBLEMS.length : 0
            });
            
            // data/demo-problems.js에서 로드된 DEMO_PROBLEMS 사용
            const allProblems = window.DEMO_PROBLEMS || [];
            console.log('모든 문제 개수:', allProblems.length);
            
            if (allProblems.length > 0) {
                console.log('샘플 문제:', allProblems[0]);
            }
            
            quizData = allProblems.filter(q => {
                const difficultyMatch = difficulties.includes(q.difficulty);
                const typeMatch = types.includes(q.type);
                if (!difficultyMatch) console.warn('난이도 미스매치:', q.id, 'q.difficulty:', q.difficulty, 'selected:', difficulties);
                if (!typeMatch) console.warn('타입 미스매치:', q.id, 'q.type:', q.type, 'selected:', types);
                return difficultyMatch && typeMatch;
            });
            console.log('필터링된 문제:', quizData.length, '개');
            
            if (quizData.length === 0) {
                alert('선택한 난이도와 유형에 해당하는 문제가 없습니다.');
                console.error('사용 가능한 문제 없음');
                return;
            }
            
            if (quizData.length > count) { 
                quizData = quizData.sort(() => Math.random() - 0.5).slice(0, count);
            }
            
            // 문제 포맷 변환: correctAnswer를 answer로 통일
            quizData = quizData.map((q, idx) => ({
                ...q,
                id: q.id || `demo_q_${idx}`,
                type: q.type || 'multiple_choice',
                difficulty: q.difficulty || 'medium',
                answer: q.correctAnswer || null,
                explanation: q.explanation || ''
            }));
            
            console.log('최종 문제:', quizData.length, '개');
            startQuizSession();
        }

        function showGenerationProgress() {
            document.getElementById('generationProgress').style.display = 'block';
            const steps = [
                { id: 'analysis', label: '자료 분석' },
                { id: 'generation', label: '문제 생성' },
                { id: 'validation', label: '검증' }
            ];
            
            let stepsHTML = '';
            steps.forEach(step => {
                stepsHTML += `<div class="step" id="step-${step.id}">${step.label}</div>`;
            });
            document.getElementById('progressSteps').innerHTML = stepsHTML;
        }

        function updateProgressStep(stepId, status, message) {
            const element = document.getElementById(`step-${stepId}`);
            if (element) {
                element.className = `step ${status}`;
            }
            document.getElementById('generationStatus').textContent = message;
        }        function startQuizSession() {
            console.log('퀴즈 세션 시작:', quizData.length, '개 문제');
            
            if (!quizData || quizData.length === 0) {
                alert('문제가 없습니다. 문제 생성을 다시 시도해주세요.');
                console.error('quizData가 비어있음');
                return;
            }
            
            document.getElementById('generationProgress').style.display = 'none';
            currentQuestion = 0;
            answers = new Array(quizData.length).fill(null);
            wrongAnswers = [];

            document.getElementById('setupSection').classList.add('hidden');
            document.getElementById('quizSection').classList.remove('hidden');
            displayProblem();        }

        function displayProblem() {
            const problem = quizData[currentQuestion];
            console.log('문제 표시:', currentQuestion + 1, '/', quizData.length, problem);
            
            if (!problem) {
                console.error('문제가 없음:', currentQuestion);
                return;
            }
            
            const progress = ((currentQuestion + 1) / quizData.length) * 100;

            document.getElementById('questionInfo').textContent = `문제 ${currentQuestion + 1} / ${quizData.length}`;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('questionText').textContent = problem.question || '문제 내용이 없습니다.';

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            nextBtn.textContent = '다음 문제';
            nextBtn.onclick = () => nextProblem();

            // 모르겠음 버튼 표시 여부
            const skipBtn = document.getElementById('skipBtn');
            skipBtn.style.display = problem.type === 'multiple_choice' ? 'none' : 'block';
            
            // 문제 유형에 따라 다른 입력 방식 제공
            if (problem.type === 'multiple_choice' && problem.options && problem.options.length > 0) {
                // 객관식: 선택지 버튼
                problem.options.forEach((option, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option-item';
                    optionDiv.textContent = option;
                    optionDiv.onclick = () => selectAnswer(index);
                    optionsDiv.appendChild(optionDiv);
                });
                
                // 이미 답변했으면 선택 상태 복원
                if (answers[currentQuestion] !== null && typeof answers[currentQuestion] === 'number') {
                    const selectedOption = optionsDiv.children[answers[currentQuestion]];
                    if (selectedOption) selectedOption.classList.add('selected');
                }
            } else if (problem.type === 'essay') {
                // 서술형: 텍스트 영역
                const group = document.createElement('div');
                group.className = 'answer-input-group';
                const textarea = document.createElement('textarea');
                textarea.id = 'answerInput';
                textarea.placeholder = '답변을 입력하세요...';
                textarea.value = answers[currentQuestion] || '';
                textarea.oninput = () => selectAnswer(textarea.value);
                group.appendChild(textarea);
                group.appendChild(document.createElement('div')).className = 'answer-input-placeholder';
                optionsDiv.appendChild(group);
                nextBtn.disabled = false; // 서술형은 빈 답도 진행 가능
                textarea.focus();
            } else if (problem.type === 'short_answer' || problem.type === 'calculation') {
                // 단답형/계산형: 텍스트 입력
                const group = document.createElement('div');
                group.className = 'answer-input-group';
                const input = document.createElement('input');
                input.id = 'answerInput';
                input.type = 'text';
                input.placeholder = problem.type === 'calculation' ? '계산 결과를 입력하세요...' : '답을 입력하세요...';
                input.value = answers[currentQuestion] || '';
                input.oninput = () => selectAnswer(input.value);
                input.onkeypress = (e) => {
                    if (e.key === 'Enter' && answers[currentQuestion]) {
                        nextProblem();
                    }
                };
                group.appendChild(input);
                optionsDiv.appendChild(group);
                nextBtn.disabled = false; // 빈 답이라도 진행 가능
                input.focus();
            } else {
                console.warn('지원하지 않는 문제 유형:', problem.type);
            }

            document.getElementById('solution').classList.add('hidden');
            
            // 문제 풀이 시간 측정 시작
            questionStartTime = Date.now();
        }

        function selectAnswer(answer) {
            answers[currentQuestion] = answer;
            const problem = quizData[currentQuestion];
            
            // 객관식인 경우만 선택 상태 UI 업데이트
            if (problem.type === 'multiple_choice' && typeof answer === 'number') {
                const optionsDiv = document.getElementById('options');
                Array.from(optionsDiv.children).forEach((child, i) => {
                    child.classList.remove('selected');
                });
                if (optionsDiv.children[answer]) {
                    optionsDiv.children[answer].classList.add('selected');
                }
            }
            
            // 다음 버튼 활성화 (답변이 있을 경우)
            const nextBtn = document.getElementById('nextBtn');
            if (answers[currentQuestion] !== null && answers[currentQuestion] !== '') {
                nextBtn.disabled = false;
            }
        }

        function skipQuestion() {
            // 모르겠음 버튼: 빈 답으로 진행
            answers[currentQuestion] = '';
            nextProblem();
        }

        function skipQuestion() {
            // 모르겠음 버튼: 빈 답으로 진행
            answers[currentQuestion] = '';
            nextProblem();
        }

        async function nextProblem() {
            const problem = quizData[currentQuestion];
            
            // 1단계: 답변 선택 확인 (객관식만 필수)
            if (problem.type === 'multiple_choice' && answers[currentQuestion] === null) {
                alert('선택지를 선택하세요!');
                return;
            }
            
            // 다른 유형은 빈 답도 허용
            if (answers[currentQuestion] === null) {
                answers[currentQuestion] = '';
            }

            // 2단계: 정답/오답 확인 및 해설 표시
            const correctAnswer = problem.answer || (problem.options ? problem.options[0] : null);
            let userAnswer;
            
            if (problem.type === 'multiple_choice') {
                // 객관식: 선택한 선택지
                userAnswer = problem.options ? problem.options[answers[currentQuestion]] : null;
            } else {
                // 단답형/계산형/서술형: 입력한 텍스트
                userAnswer = answers[currentQuestion];
            }
            
            const isCorrect = userAnswer === correctAnswer;

            // 3단계: 옵션 시각적 업데이트 (정답/오답 표시) - 객관식만 해당
            if (problem.type === 'multiple_choice') {
                const optionsDiv = document.getElementById('options');
                Array.from(optionsDiv.children).forEach((child, i) => {
                    child.classList.remove('selected');
                    if (problem.options && problem.options[i] === correctAnswer) {
                        child.classList.add('correct');
                    }
                    else if (i === answers[currentQuestion] && !isCorrect) {
                        child.classList.add('incorrect');
                    }
                });
            }

            // 4단계: 해설 표시
            document.getElementById('solutionText').textContent = problem.explanation || problem.solution;
            document.getElementById('solution').classList.remove('hidden');

            // 5단계: 풀이 시간 계산
            const timeSpent = Math.floor((Date.now() - questionStartTime) / 1000); // 초 단위

            // 6단계: 학습 데이터 저장 (IndexedDB - stats_engine.js)
            const attemptId = await saveQuestionAttempt(problem, isCorrect, userAnswer, correctAnswer, timeSpent);            // 7단계: 복습 모드인 경우 오답 상태 업데이트
            if (reviewMode && reviewWrongAnswerId) {
                await WrongAnswerManager.processReview(reviewWrongAnswerId, isCorrect);
            }
            // 8단계: 일반 모드이고 오답인 경우 오답 노트에 저장 (wrong_answer_engine.js)
            else if (!isCorrect) {
                const problemData = {
                    question: problem.question,
                    concepts: problem.concepts || [],
                    explanation: problem.explanation || problem.solution,
                    type: problem.type || 'multiple_choice',
                    difficulty: problem.difficulty || 'medium'
                };

                const attemptData = {
                    questionId: problem.id || `q_${Date.now()}`,
                    workbookId: 'app_ai_session',
                    userAnswer: userAnswer,
                    correctAnswer: correctAnswer,
                    usedHint: false
                };

                await WrongAnswerManager.addWrongAnswer(attemptData, problemData);

                // 메모리에도 저장 (모달용)
                wrongAnswers.push({
                    question: problem.question,
                    userAnswer: userAnswer,
                    correctAnswer: correctAnswer,
                    solution: problem.explanation || problem.solution,
                    difficulty: problem.difficulty,
                    type: problem.type
                });
            }            // 9단계: 다음 버튼 활성화 및 설정
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = false;

            // 마지막 문제인지 확인
            if (currentQuestion >= quizData.length - 1) {
                // 마지막 문제
                nextBtn.textContent = reviewMode ? '복습 완료' : '제출하기';
                nextBtn.onclick = () => showCompletion();
            } else {
                // 중간 문제 - 다음 문제로 이동
                nextBtn.textContent = '다음 문제';
                nextBtn.onclick = () => moveToNextProblem();
            }
        }

        /**
         * 문제 풀이 데이터 저장
         */
        async function saveQuestionAttempt(problem, isCorrect, userAnswer, correctAnswer, timeSpent) {
            try {
                const attemptId = await StatsDB.saveAttempt({
                    questionId: problem.id || `q_${Date.now()}`,
                    workbookId: 'app_ai_session',
                    concepts: problem.concepts || [],
                    questionType: problem.type || 'multiple_choice',
                    difficulty: problem.difficulty || 'medium',
                    isCorrect: isCorrect,
                    usedHint: false,
                    hintLevel: 0,
                    timeSpent: timeSpent,
                    question: problem.question,
                    userAnswer: userAnswer,
                    correctAnswer: correctAnswer
                });
                return attemptId;
            } catch (error) {
                console.error('학습 데이터 저장 실패:', error);
                return null;
            }
        }        function moveToNextProblem() {
            currentQuestion++;
            displayProblem();
            
            // 다음 문제 표시 후 버튼 상태 초기화
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            nextBtn.textContent = '다음 문제';
            nextBtn.onclick = () => nextProblem();
        }

        function showCompletion() {
            // 복습 모드인 경우 오답노트로 즉시 이동
            if (reviewMode) {
                window.location.href = 'wrong_notes.html';
                return;
            }

            const correct = answers.filter((ans, i) => {
                const problem = quizData[i];
                const correctAnswer = problem.answer || problem.options[0];
                const userAnswer = problem.options ? problem.options[ans] : ans;
                return userAnswer === correctAnswer;
            }).length;
            const total = quizData.length;
            const rate = Math.round((correct / total) * 100);

            document.getElementById('quizSection').classList.add('hidden');
            document.getElementById('completionScreen').classList.remove('hidden');

            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = total - correct;
            document.getElementById('correctRate').textContent = rate + '%';
            document.getElementById('totalCount').textContent = total;

            if (wrongAnswers.length === 0) {
                document.getElementById('wrongNotesBtn').textContent = '🎯 완벽합니다!';
                document.getElementById('wrongNotesBtn').disabled = true;
            } else {
                // 오답노트 버튼을 별도 페이지로 링크
                document.getElementById('wrongNotesBtn').onclick = () => window.location.href = 'wrong_notes.html';
            }
        }

        function showWrongNotes() {
            if (wrongAnswers.length === 0) return;

            let html = '';
            const difficulties = ['easy', 'medium', 'hard'];
            const difficultyLabels = { easy: '📊 하', medium: '📊 중', hard: '📊 상' };

            difficulties.forEach(diff => {
                const wrongByDiff = wrongAnswers.filter(w => w.difficulty === diff);
                if (wrongByDiff.length > 0) {
                    html += `<div class="category-header">${difficultyLabels[diff]}</div>`;
                    wrongByDiff.forEach(wrong => {
                        html += `
                            <div class="wrong-item">
                                <div class="wrong-question">Q. ${wrong.question}</div>
                                <div class="wrong-answer">❌ 내 답: ${wrong.userAnswer}</div>
                                <div class="correct-answer">✅ 정답: ${wrong.correctAnswer}</div>
                                <div class="explanation">${wrong.solution}</div>
                            </div>
                        `;
                    });
                }
            });

            document.getElementById('wrongNotesContent').innerHTML = html;
            document.getElementById('wrongNotesModal').classList.add('active');
        }

        function closeWrongNotes() {
            document.getElementById('wrongNotesModal').classList.remove('active');
        }        function resetQuiz() {
            if (reviewMode) {
                // 복습 모드에서는 오답노트로 이동
                window.location.href = 'wrong_notes.html';
            } else {
                // 일반 모드에서는 설정 화면으로 돌아감
                document.getElementById('setupSection').classList.remove('hidden');
                document.getElementById('quizSection').classList.add('hidden');
                document.getElementById('completionScreen').classList.add('hidden');
                document.getElementById('wrongNotesModal').classList.remove('active');
                currentQuestion = 0;
                answers = [];
                wrongAnswers = [];
            }
        }
    </script>
