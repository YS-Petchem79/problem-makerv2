<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오답노트 - 스마트 복습 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            color: white;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 32px; }
        .header button {
            padding: 10px 20px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            transition: all 0.3s;
        }
        .header button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* 통계 영역 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .stat-label {
            color: #666;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-unit {
            font-size: 12px;
            color: #999;
            margin-left: 5px;
        }

        /* 필터 영역 */
        .filters-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .filter-title {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            color: #333;
        }
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .filter-btn:hover {
            border-color: #667eea;
        }

        /* 오답 카드 */
        .wrong-answers-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .wrong-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .wrong-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }
        .wrong-card.resolved {
            background: #f0fdf4;
            border-color: #10b981;
        }
        .wrong-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }
        .wrong-card-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            flex: 1;
            line-height: 1.4;
        }
        .wrong-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            margin-left: 10px;
        }
        .badge-unresolved {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-resolved {
            background: #d1fae5;
            color: #065f46;
        }
        .badge-reason {
            background: #fef3c7;
            color: #92400e;
        }
        .wrong-card-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #666;
            flex-wrap: wrap;
        }
        .wrong-answer-preview {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: 3px solid #667eea;
        }
        .answer-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .answer-text {
            color: #333;
            font-size: 13px;
        }
        .your-answer { border-left-color: #ef4444; }
        .correct-answer { border-left-color: #10b981; }

        .wrong-concepts {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .concept-tag {
            display: inline-block;
            padding: 4px 10px;
            background: #e0e7ff;
            color: #4f46e5;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .wrong-card-actions {
            display: flex;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }
        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }
        .btn-review {
            background: #667eea;
            color: white;
        }
        .btn-review:hover {
            background: #5568d3;
        }
        .btn-similar {
            background: #ec4899;
            color: white;
        }
        .btn-similar:hover {
            background: #be185d;
        }
        .btn-delete {
            background: #e5e7eb;
            color: #333;
        }
        .btn-delete:hover {
            background: #d1d5db;
        }

        /* 상세 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            border: none;
            background: #e5e7eb;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        .modal-close:hover {
            background: #d1d5db;
        }

        .modal-section {
            margin-bottom: 25px;
        }
        .modal-section-title {
            font-size: 14px;
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .problem-statement {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 15px;
        }
        .hint-section {
            background: #fef3c7;
            border-left: 4px solid #fbbf24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .hint-btn {
            padding: 8px 16px;
            background: #fbbf24;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        .hint-btn:hover {
            background: #f59e0b;
        }
        .hint-text {
            margin-top: 10px;
            color: #92400e;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .empty-state-text {
            font-size: 16px;
            margin-bottom: 30px;
        }

        .review-modal-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .review-modal-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .filter-group {
                flex-direction: column;
            }
            .filter-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div>
                <h1>📝 오답노트</h1>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="goToApp()">← 문제 풀러 가기</button>
                <button onclick="goToStats()">📊 학습 통계</button>
            </div>
        </div>

        <!-- 통계 -->
        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-label">누적 오답</div>
                <div class="stat-value" id="totalWrong">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">미해결</div>
                <div class="stat-value" id="unresolvedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">복습 완료</div>
                <div class="stat-value" id="resolvedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">가장 취약한 개념</div>
                <div class="stat-value" style="font-size: 14px;" id="commonConcept">N/A</div>
            </div>
        </div>

        <!-- 필터 -->
        <div class="filters-section">
            <div class="filter-title">필터</div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterByStatus('all')">전체</button>
                <button class="filter-btn" onclick="filterByStatus('unresolved')">미해결</button>
                <button class="filter-btn" onclick="filterByStatus('resolved')">복습 완료</button>
                <button class="filter-btn" onclick="filterByReason('개념 이해 부족')">개념 부족</button>
                <button class="filter-btn" onclick="filterByReason('계산 실수')">계산 실수</button>
                <button class="filter-btn" onclick="filterByReason('문제 해석 오류')">해석 오류</button>
            </div>
        </div>

        <!-- 오답 목록 -->
        <div class="wrong-answers-section">
            <div id="wrongAnswersContainer"></div>
        </div>
    </div>

    <!-- 오답 상세 모달 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDetailModal()">×</button>
            
            <!-- 문제 -->
            <div class="modal-section">
                <div class="modal-section-title">문제</div>
                <div class="problem-statement" id="modalProblem"></div>
            </div>

            <!-- 내 답과 정답 -->
            <div class="modal-section">
                <div class="modal-section-title">답변</div>
                <div class="wrong-answer-preview your-answer">
                    <div class="answer-label">내가 입력한 답</div>
                    <div class="answer-text" id="modalUserAnswer"></div>
                </div>
                <div class="wrong-answer-preview correct-answer">
                    <div class="answer-label">정답</div>
                    <div class="answer-text" id="modalCorrectAnswer"></div>
                </div>
            </div>

            <!-- 오답 원인 -->
            <div class="modal-section">
                <div class="modal-section-title">오답 원인</div>
                <div style="background: #e0f2fe; border-left: 4px solid #0284c7; padding: 12px; border-radius: 6px; color: #0c2d48;">
                    <div id="modalWrongReason"></div>
                </div>
            </div>

            <!-- 관련 개념 -->
            <div class="modal-section">
                <div class="modal-section-title">관련 개념</div>
                <div class="wrong-concepts" id="modalConcepts"></div>
            </div>

            <!-- 단계별 힌트 -->
            <div class="modal-section">
                <div class="modal-section-title">풀이</div>
                <div id="hintsContainer"></div>
                <div class="hint-section">
                    <button class="hint-btn" onclick="toggleHint('explanation')">상세 풀이 보기</button>
                    <div id="explanationHint" class="hint-text" style="display: none; margin-top: 10px;"></div>
                </div>
            </div>

            <!-- 버튼 -->
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="action-btn btn-review" onclick="startReview()">🔄 다시 풀기</button>
                <button class="action-btn btn-similar" onclick="generateSimilarProblem()">🎯 유사 문제 생성</button>
                <button class="action-btn btn-delete" onclick="deleteWrongAnswer()">🗑️ 삭제</button>
            </div>
        </div>
    </div>

    <script src="stats_engine.js"></script>
    <script src="wrong_answer_engine.js"></script>
    <script>
        let allWrongAnswers = [];
        let currentWrongAnswer = null;
        let currentFilter = 'all';

        async function init() {
            await WrongAnswerDB.init();
            await refreshDisplay();
        }

        async function refreshDisplay() {
            allWrongAnswers = await WrongAnswerDB.getAllWrongAnswers();
            await displayStats();
            await displayWrongAnswers();
        }

        async function displayStats() {
            const stats = await WrongAnswerAnalyzer.calculateWrongAnswerStats(allWrongAnswers);
            
            document.getElementById('totalWrong').textContent = stats.totalWrong;
            document.getElementById('unresolvedCount').textContent = stats.unresolved;
            document.getElementById('resolvedCount').textContent = stats.resolved;
            document.getElementById('commonConcept').textContent = stats.mostCommonConcept !== 'N/A' 
                ? stats.mostCommonConcept 
                : 'N/A';
        }

        async function displayWrongAnswers() {
            const container = document.getElementById('wrongAnswersContainer');
            let filtered = allWrongAnswers;

            // 필터 적용
            if (currentFilter !== 'all') {
                filtered = filtered.filter(wa => {
                    if (currentFilter.startsWith('status:')) {
                        return wa.reviewStatus === currentFilter.substring(7);
                    } else if (currentFilter.startsWith('reason:')) {
                        return wa.wrongReason === currentFilter.substring(7);
                    }
                    return true;
                });
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">오답이 없습니다!</div>
                        <p style="color: #ccc; font-size: 14px;">문제를 풀어서 오답을 저장해보세요.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(wa => `
                <div class="wrong-card ${wa.reviewStatus === 'resolved' ? 'resolved' : ''}" onclick="openDetailModal('${wa.wrongAnswerId}')">
                    <div class="wrong-card-header">
                        <div class="wrong-card-title">${wa.question}</div>
                        <span class="wrong-badge ${wa.reviewStatus === 'resolved' ? 'badge-resolved' : 'badge-unresolved'}">
                            ${wa.reviewStatus === 'resolved' ? '✓ 해결' : '△ 미해결'}
                        </span>
                    </div>
                    <div class="wrong-card-meta">
                        <span>📊 ${wa.difficulty === 'easy' ? '하' : wa.difficulty === 'medium' ? '중' : '상'}</span>
                        <span>❌ ${wa.wrongCount}회 오답</span>
                        <span>📅 ${new Date(wa.createdAt).toLocaleDateString()}</span>
                    </div>
                    <div class="wrong-answer-preview your-answer">
                        <div class="answer-label">내 답</div>
                        <div class="answer-text">${wa.userAnswer}</div>
                    </div>
                    <div class="wrong-answer-preview correct-answer">
                        <div class="answer-label">정답</div>
                        <div class="answer-text">${wa.correctAnswer}</div>
                    </div>
                    ${wa.wrongReason ? `
                        <div style="margin-top: 10px;">
                            <span class="wrong-badge badge-reason">${wa.wrongReason}</span>
                        </div>
                    ` : ''}
                    <div class="wrong-concepts">
                        ${wa.concepts.map(c => `<span class="concept-tag">${c}</span>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        async function openDetailModal(wrongAnswerId) {
            currentWrongAnswer = allWrongAnswers.find(wa => wa.wrongAnswerId === wrongAnswerId);
            if (!currentWrongAnswer) return;

            document.getElementById('modalProblem').textContent = currentWrongAnswer.question;
            document.getElementById('modalUserAnswer').textContent = currentWrongAnswer.userAnswer;
            document.getElementById('modalCorrectAnswer').textContent = currentWrongAnswer.correctAnswer;
            document.getElementById('modalWrongReason').textContent = currentWrongAnswer.wrongReason || '분석 중...';
            document.getElementById('modalConcepts').innerHTML = currentWrongAnswer.concepts
                .map(c => `<span class="concept-tag">${c}</span>`)
                .join('');

            // 해설 표시
            document.getElementById('explanationHint').textContent = currentWrongAnswer.explanation;

            document.getElementById('detailModal').classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
            currentWrongAnswer = null;
        }

        function toggleHint(type) {
            const elem = document.getElementById(type + 'Hint');
            elem.style.display = elem.style.display === 'none' ? 'block' : 'none';
        }        async function startReview() {
            if (!currentWrongAnswer) return;
            
            // 복습 모드로 app_ai.html 오픈
            window.location.href = 'app_ai.html?review=' + currentWrongAnswer.questionId;
        }

        async function generateSimilarProblem() {
            if (!currentWrongAnswer) return;
            alert('유사 문제 생성 기능은 서버 API와 연동 필요합니다.');
        }

        async function deleteWrongAnswer() {
            if (!currentWrongAnswer) return;
            
            if (confirm('이 오답을 삭제하시겠습니까?')) {
                await WrongAnswerDB.deleteWrongAnswer(currentWrongAnswer.wrongAnswerId);
                closeDetailModal();
                await refreshDisplay();
            }
        }        function filterByStatus(status) {
            currentFilter = status === 'all' ? 'all' : 'status:' + status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayWrongAnswers();
        }

        function filterByReason(reason) {
            currentFilter = 'reason:' + reason;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            displayWrongAnswers();
        }

        function goToApp() {
            window.location.href = 'app_ai.html';
        }

        function goToStats() {
            window.location.href = 'stats_dashboard.html';
        }

        // 페이지 로드 시 초기화
        window.addEventListener('load', init);
    </script>
</body>
</html>
