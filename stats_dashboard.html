<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 통계 대시보드</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            color: white;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 32px; }
        .header button {
            padding: 10px 20px;
            background: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #667eea;
            transition: all 0.3s;
        }
        .header button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .top-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }
        .stat-label {
            color: #666;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-unit {
            font-size: 14px;
            color: #999;
            margin-left: 5px;
        }
        .achievement-score {
            position: relative;
            display: inline-block;
            width: 100%;
            text-align: center;
        }
        .achievement-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            background: conic-gradient(#667eea var(--percentage), #e5e7eb var(--percentage));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .chart-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
        }
        .stats-comparison {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .comparison-item {
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .comparison-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }
        .comparison-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .concepts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .concept-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .concept-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .concept-info {
            flex: 1;
        }
        .concept-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .concept-details {
            font-size: 12px;
            color: #999;
        }
        .concept-accuracy {
            font-size: 18px;
            font-weight: 700;
            color: #667eea;
            text-align: right;
            min-width: 60px;
        }
        .weak-level {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 10px;
        }
        .weak-level.critical {
            background: #fee2e2;
            color: #991b1b;
        }
        .weak-level.warning {
            background: #fef3c7;
            color: #92400e;
        }
        .weak-level.normal {
            background: #f0fdf4;
            color: #065f46;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
        .study-log {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .log-item {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .log-item:last-child {
            border-bottom: none;
        }
        .log-question {
            flex: 1;
        }
        .log-question-text {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .log-meta {
            font-size: 12px;
            color: #999;
        }
        .log-answer {
            text-align: right;
        }
        .log-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .log-badge.correct {
            background: #d1fae5;
            color: #065f46;
        }
        .log-badge.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }
        .summary-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }
        .summary-title {
            font-size: 14px;
            color: #667eea;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .summary-text {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
        .test-data-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .test-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .test-buttons button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-generate {
            background: #667eea;
            color: white;
        }
        .btn-generate:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-clear {
            background: #fee2e2;
            color: #991b1b;
        }
        .btn-clear:hover {
            background: #fecaca;
            transform: translateY(-2px);
        }
        .btn-export {
            background: #e5e7eb;
            color: #333;
        }
        .btn-export:hover {
            background: #d1d5db;
            transform: translateY(-2px);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            border: none;
            background: #e5e7eb;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }
        .modal-close:hover {
            background: #d1d5db;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        .no-data {
            display: none;
        }
        .no-data.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 헤더 -->
        <div class="header">
            <div>
                <h1>📊 학습 통계 대시보드</h1>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="goBackToApp()">← 문제 풀러 가기</button>
            </div>
        </div>

        <!-- 상단 통계 -->
        <div class="top-stats">
            <div class="stat-card">
                <div class="stat-label">총 풀이 문제</div>
                <div class="stat-value" id="totalProblems">0<span class="stat-unit">개</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">전체 정답률</div>
                <div class="stat-value" id="overallAccuracy">0<span class="stat-unit">%</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">평균 풀이 시간</div>
                <div class="stat-value" id="averageTime">0<span class="stat-unit">초</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">연속 학습일</div>
                <div class="stat-value" id="studyStreak">0<span class="stat-unit">일</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">학습 성취도</div>
                <div class="achievement-score">
                    <div class="achievement-circle" id="achievementCircle" style="--percentage: 0%;">0</div>
                    <div style="font-size: 12px; color: #999;">0~100</div>
                </div>
            </div>
        </div>

        <!-- 학습 요약 -->
        <div id="summaryBox" class="summary-box" style="display: none;">
            <div class="summary-title">📝 학습 요약</div>
            <div class="summary-text" id="summaryText"></div>
        </div>

        <!-- 테스트 데이터 섹션 -->
        <div class="test-data-section">
            <div class="chart-title">🧪 테스트 데이터 관리</div>
            <div class="test-buttons">
                <button class="btn-generate" onclick="generateTestData()">30개 테스트 데이터 생성</button>
                <button class="btn-export" onclick="exportDataAsJSON()">데이터 내보내기 (JSON)</button>
                <button class="btn-clear" onclick="clearAllData()">모든 데이터 삭제</button>
            </div>
        </div>

        <!-- 차트 영역 -->
        <div class="charts-row">
            <!-- 정답률 추이 -->
            <div class="chart-card">
                <div class="chart-title">📈 정답률 추이</div>
                <canvas id="accuracyChart"></canvas>
                <div id="accuracyEmpty" class="no-data show">
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <p>아직 학습 데이터가 없습니다.</p>
                    </div>
                </div>
            </div>

            <!-- 문제 유형별 정답률 -->
            <div class="chart-card">
                <div class="chart-title">🎯 문제 유형별 정답률</div>
                <div class="stats-comparison" id="typeStatsContainer">
                    <div id="typeEmpty" class="no-data show">
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <p>아직 학습 데이터가 없습니다.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 난이도별 정답률 -->
            <div class="chart-card">
                <div class="chart-title">🏆 난이도별 정답률</div>
                <div class="stats-comparison" id="difficultyStatsContainer">
                    <div id="diffEmpty" class="no-data show">
                        <div class="empty-state">
                            <div class="empty-state-icon">⚡</div>
                            <p>아직 학습 데이터가 없습니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 개념 관련 섹션 -->
        <div class="concepts-section">
            <!-- 취약 개념 TOP 5 -->
            <div class="concept-card">
                <div class="chart-title">⚠️ 취약 개념 TOP 5</div>
                <div id="weakConceptsContainer">
                    <div id="weakConceptEmpty" class="no-data show">
                        <div class="empty-state">
                            <div class="empty-state-icon">💡</div>
                            <p>아직 학습 데이터가 없습니다.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 개념별 정답률 -->
            <div class="concept-card">
                <div class="chart-title">📚 개념별 정답률</div>
                <div id="conceptAccuracyContainer">
                    <div id="conceptEmpty" class="no-data show">
                        <div class="empty-state">
                            <div class="empty-state-icon">📖</div>
                            <p>아직 학습 데이터가 없습니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 최근 학습 기록 -->
        <div class="study-log">
            <div class="chart-title">📋 최근 오답 (최근 5개)</div>
            <div id="recentWrongAnswersContainer">
                <div id="recentWrongEmpty" class="no-data show">
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <p>오답이 없습니다!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 개념 숙련도 모달 -->
    <div class="modal" id="conceptProgressModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeConceptProgressModal()">×</button>
            <div class="chart-title">📈 개념 숙련도 추이</div>
            <div id="conceptProgressChart" style="margin-top: 20px;"></div>
            <canvas id="progressChart" style="margin-top: 20px;"></canvas>
        </div>
    </div>

    <script src="stats_engine.js"></script>
    <script>
        let accuracyChart = null;
        let progressChart = null;

        /**
         * 대시보드 초기화
         */
        async function initDashboard() {
            await StatsDB.init();
            await refreshDashboard();
        }

        /**
         * 대시보드 새로고침
         */
        async function refreshDashboard() {
            const attempts = await StatsDB.getAllAttempts();

            if (attempts.length === 0) {
                showEmptyState();
                return;
            }

            // 상단 통계
            document.getElementById('totalProblems').textContent = attempts.length;
            document.getElementById('overallAccuracy').textContent = StatsCalculator.calculateOverallAccuracy(attempts);
            document.getElementById('averageTime').textContent = StatsCalculator.calculateAverageTime(attempts);
            document.getElementById('studyStreak').textContent = StatsCalculator.calculateStudyStreak(attempts);

            // 학습 성취도
            const achievement = StatsCalculator.calculateAchievementScore(attempts);
            document.getElementById('achievementCircle').style.setProperty('--percentage', `${achievement}%`);
            document.getElementById('achievementCircle').textContent = achievement;

            // 학습 요약
            const summary = StatsCalculator.generateStudySummary(attempts);
            document.getElementById('summaryBox').style.display = 'block';
            document.getElementById('summaryText').textContent = summary;

            // 차트 및 통계
            displayAccuracyTrend(attempts);
            displayTypeStats(attempts);
            displayDifficultyStats(attempts);
            displayWeakConcepts(attempts);
            displayConceptAccuracy(attempts);
            displayRecentWrongAnswers(attempts);

            // 빈 상태 숨기기
            document.querySelectorAll('.no-data').forEach(el => {
                el.classList.remove('show');
            });
        }

        /**
         * 정답률 추이 차트
         */
        function displayAccuracyTrend(attempts) {
            const dailyAccuracy = StatsCalculator.calculateDailyAccuracy(attempts);

            const ctx = document.getElementById('accuracyChart').getContext('2d');
            
            if (accuracyChart) {
                accuracyChart.destroy();
            }

            accuracyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dailyAccuracy.map(d => d.date),
                    datasets: [{
                        label: '정답률 (%)',
                        data: dailyAccuracy.map(d => d.accuracy),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: 'white',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: true }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { callback: (value) => `${value}%` }
                        }
                    }
                }
            });

            document.getElementById('accuracyEmpty').classList.remove('show');
        }

        /**
         * 문제 유형별 정답률 표시
         */
        function displayTypeStats(attempts) {
            const typeStats = StatsCalculator.calculateTypeAccuracy(attempts);
            let html = '';

            typeStats.forEach(stat => {
                html += `
                    <div class="comparison-item">
                        <div class="comparison-label">${stat.label}</div>
                        <div class="comparison-value">${stat.accuracy}%</div>
                        <div style="font-size: 11px; color: #999; margin-top: 5px;">${stat.correct}/${stat.total}</div>
                    </div>
                `;
            });

            document.getElementById('typeStatsContainer').innerHTML = html;
            document.getElementById('typeEmpty').classList.remove('show');
        }

        /**
         * 난이도별 정답률 표시
         */
        function displayDifficultyStats(attempts) {
            const diffStats = StatsCalculator.calculateDifficultyAccuracy(attempts);
            let html = '';

            diffStats.forEach(stat => {
                html += `
                    <div class="comparison-item">
                        <div class="comparison-label">${stat.label}</div>
                        <div class="comparison-value">${stat.accuracy}%</div>
                        <div style="font-size: 11px; color: #999; margin-top: 5px;">${stat.correct}/${stat.total}</div>
                    </div>
                `;
            });

            document.getElementById('difficultyStatsContainer').innerHTML = html;
            document.getElementById('diffEmpty').classList.remove('show');
        }

        /**
         * 취약 개념 TOP 5 표시
         */
        function displayWeakConcepts(attempts) {
            const weakConcepts = StatsCalculator.getWeakConcepts(attempts, 5);
            let html = '';

            if (weakConcepts.length === 0) {
                document.getElementById('weakConceptEmpty').classList.add('show');
                return;
            }

            weakConcepts.forEach(concept => {
                const levelClass = concept.accuracy < 60 ? 'critical' : concept.accuracy < 70 ? 'warning' : 'normal';
                html += `
                    <div class="concept-item" onclick="showConceptProgress('${concept.concept}');" style="cursor: pointer;">
                        <div class="concept-info">
                            <div class="concept-name">${concept.concept}</div>
                            <div class="concept-details">${concept.correct}/${concept.total} 정답</div>
                        </div>
                        <div style="text-align: right;">
                            <div class="concept-accuracy">${concept.accuracy}%</div>
                            <span class="weak-level ${levelClass}">${concept.weakLevel}</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('weakConceptsContainer').innerHTML = html;
            document.getElementById('weakConceptEmpty').classList.remove('show');
        }

        /**
         * 개념별 정답률 표시
         */
        function displayConceptAccuracy(attempts) {
            const conceptAccuracy = StatsCalculator.calculateConceptAccuracy(attempts);
            let html = '';

            if (conceptAccuracy.length === 0) {
                document.getElementById('conceptEmpty').classList.add('show');
                return;
            }

            // 상위 10개만 표시
            conceptAccuracy.slice(0, 10).forEach(item => {
                html += `
                    <div class="concept-item" onclick="showConceptProgress('${item.concept}');" style="cursor: pointer;">
                        <div class="concept-info">
                            <div class="concept-name">${item.concept}</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${item.accuracy}%"></div>
                            </div>
                        </div>
                        <div class="concept-accuracy">${item.accuracy}%</div>
                    </div>
                `;
            });

            document.getElementById('conceptAccuracyContainer').innerHTML = html;
            document.getElementById('conceptEmpty').classList.remove('show');
        }

        /**
         * 최근 오답 표시
         */
        function displayRecentWrongAnswers(attempts) {
            const wrongAnswers = StatsCalculator.getRecentWrongAnswers(attempts, 5);
            let html = '';

            if (wrongAnswers.length === 0) {
                document.getElementById('recentWrongEmpty').classList.add('show');
                return;
            }

            wrongAnswers.forEach(item => {
                html += `
                    <div class="log-item">
                        <div class="log-question">
                            <div class="log-question-text">${item.question}</div>
                            <div class="log-meta">
                                <span>${item.concepts.join(', ')}</span> | 
                                <span>${item.difficulty === 'easy' ? '하' : item.difficulty === 'medium' ? '중' : '상'} 난이도</span>
                            </div>
                        </div>
                        <div class="log-answer">
                            <div class="log-badge incorrect">❌ ${item.userAnswer}</div>
                            <div class="log-badge correct">✅ ${item.correctAnswer}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('recentWrongAnswersContainer').innerHTML = html;
            document.getElementById('recentWrongEmpty').classList.remove('show');
        }

        /**
         * 개념 숙련도 추이 표시
         */
        async function showConceptProgress(concept) {
            const attempts = await StatsDB.getAllAttempts();
            const progress = StatsCalculator.calculateConceptProgress(attempts, concept);

            if (progress.length === 0) {
                alert('이 개념의 데이터가 부족합니다.');
                return;
            }

            const ctx = document.getElementById('progressChart').getContext('2d');
            
            if (progressChart) {
                progressChart.destroy();
            }

            progressChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: progress.map(p => `${p.stage}차`),
                    datasets: [{
                        label: '정답률 (%)',
                        data: progress.map(p => p.accuracy),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: 'white',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: true }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { callback: (value) => `${value}%` }
                        }
                    }
                }
            });

            document.getElementById('conceptProgressModal').classList.add('active');
        }

        /**
         * 개념 숙련도 모달 닫기
         */
        function closeConceptProgressModal() {
            document.getElementById('conceptProgressModal').classList.remove('active');
        }

        /**
         * 빈 상태 표시
         */
        function showEmptyState() {
            document.querySelectorAll('.no-data').forEach(el => {
                el.classList.add('show');
            });
        }

        /**
         * 테스트 데이터 생성 (30개)
         */
        async function generateTestData() {
            if (confirm('30개의 테스트 데이터를 생성하시겠습니까?')) {
                const testConcepts = [
                    '열역학 제1법칙',
                    '내부에너지',
                    '엔탈피',
                    '열전달',
                    '엔트로피',
                    'SQL SELECT',
                    '관계형 DB',
                    'Primary Key',
                    'INNER JOIN',
                    '정규화'
                ];

                const testQuestions = [
                    '다음 중 열역학 제1법칙을 설명하는 것은?',
                    '내부에너지의 정의에 해당하는 것은?',
                    '엔탈피가 증가하는 상황은?',
                    '열전달의 주요 방식 3가지는?',
                    '엔트로피는 무엇을 나타내는가?',
                    'SQL의 SELECT 문에서 조건을 지정하는 절은?',
                    '관계형 데이터베이스의 기본 단위는?',
                    'Primary Key의 특성이 아닌 것은?',
                    'INNER JOIN의 결과는?',
                    '정규화의 주요 목적은?'
                ];

                const types = ['multiple_choice', 'short_answer', 'calculation', 'essay'];
                const difficulties = ['easy', 'medium', 'hard'];

                for (let i = 0; i < 30; i++) {
                    const isCorrect = Math.random() > 0.3; // 70% 정답률
                    const timeSpent = Math.floor(Math.random() * 180) + 20; // 20~200초

                    await StatsDB.saveAttempt({
                        questionId: `q_${i + 1}`,
                        workbookId: 'demo',
                        concepts: [
                            testConcepts[Math.floor(Math.random() * testConcepts.length)],
                            testConcepts[Math.floor(Math.random() * testConcepts.length)]
                        ],
                        questionType: types[Math.floor(Math.random() * types.length)],
                        difficulty: difficulties[Math.floor(Math.random() * difficulties.length)],
                        isCorrect: isCorrect,
                        usedHint: Math.random() > 0.7,
                        hintLevel: Math.floor(Math.random() * 3),
                        timeSpent: timeSpent,
                        question: testQuestions[i % testQuestions.length],
                        userAnswer: isCorrect ? '정답' : '오답',
                        correctAnswer: '정답'
                    });
                }

                alert('테스트 데이터 30개가 생성되었습니다.');
                await refreshDashboard();
            }
        }

        /**
         * 데이터 내보내기
         */
        async function exportDataAsJSON() {
            const attempts = await StatsDB.getAllAttempts();
            const dataStr = JSON.stringify(attempts, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `study_stats_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        /**
         * 모든 데이터 삭제
         */
        async function clearAllData() {
            if (confirm('모든 학습 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                await StatsDB.clearAll();
                alert('모든 데이터가 삭제되었습니다.');
                await refreshDashboard();
            }
        }

        /**
         * 앱으로 돌아가기
         */
        function goBackToApp() {
            window.location.href = 'app_ai.html';
        }

        // 대시보드 초기화
        initDashboard();
    </script>
</body>
